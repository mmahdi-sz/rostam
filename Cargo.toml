[package]
name = "ros-telegram-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
frankenstein = { version = "0.50", features = ["client-reqwest", "trait-async"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
tokio-postgres = "0.7"
serde_json = "1"
unicode_names2 = "2"
chrono = { version = "0.4", features = ["std"] }
reqwest = { version = "0.12", features = ["rustls-tls", "multipart", "json"], default-features = false }
chrono-tz = "0.10"
notify = "6"
futures = "0.3"
rand = "0.8"
hound = "3.5"
vosk = "0.3"
libc = "0.2"
redis = { version = "0.27", features = ["tokio-comp"] }
ort = "=2.0.0-rc.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
# ترجمه‌ی زیرنویس: بایندینگ Rust برای CTranslate2 (مدل NLLB در files/models/nllb/).
# tokenizer داخل خود ct2rs است (فقط feature "tokenizers" برای خواندن tokenizer.json).
# sentencepiece را عمداً خاموش کرده‌ایم: protobuf استاتیکش با ort (moebius) تداخل
# لینک می‌سازد و NLLB به آن نیازی ندارد.
ct2rs = { version = "0.9.21", default-features = false, features = ["tokenizers", "ruy"] }


[profile.dev]
opt-level = 0
