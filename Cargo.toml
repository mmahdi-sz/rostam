[package]
name = "ros-telegram-bot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rostam-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
frankenstein = { version = "0.50", features = ["client-reqwest", "trait-async"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "signal"] }
tokio-postgres = "0.7"
deadpool-postgres = { version = "0.14", features = ["serde"] }
refinery = { version = "0.8", features = ["tokio-postgres"] }
prometheus = { version = "0.13", default-features = false, features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
regex = "1"
serde_yaml = "0.9"
unicode_names2 = "2"
chrono = { version = "0.4", features = ["std"] }
reqwest = { version = "0.12", features = ["rustls-tls", "multipart", "json", "stream"], default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
chrono-tz = "0.10"
notify = "8"
futures = "0.3"
rand = "0.8"
hound = "3.5"
vosk = "0.3"
libc = "0.2"
redis = { version = "0.27", features = ["tokio-comp"] }
ort = "=2.0.0-rc.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
# ترجمه‌ی زیرنویس: بایندینگ Rust برای CTranslate2 (مدل NLLB در files/models/nllb/).
# tokenizer داخل خود ct2rs است (فقط feature "tokenizers" برای خواندن tokenizer.json).
# sentencepiece را عمداً خاموش کرده‌ایم: protobuf استاتیکش با ort (moebius) تداخل
# لینک می‌سازد و NLLB به آن نیازی ندارد.
ct2rs = { version = "0.9.21", default-features = false, features = ["tokenizers", "ruy"] }
axum = { version = "0.8.9", features = ["json"], optional = true }
tikv-jemallocator = "0.6"
espeak-ng = "0.1.3"
piper-rs = "0.2.0"
rspotify = { version = "0.14", default-features = false, features = ["client-reqwest", "cli"] }
id3 = "1.16"
strsim = "0.11"
ar = "0.9"
tar = "0.4"
zstd = "0.13"
flate2 = "1.0"
lzma-rs = "0.3"
rpm = { version = "0.27", default-features = false, features = ["payload", "gzip-compression", "zstd-compression", "xz-compression"] }
dashmap = "6"





[profile.dev]
opt-level = 0

[features]
axum = ["dep:axum"]
testapi = ["axum"]
