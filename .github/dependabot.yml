version: 2
updates:
  # Rust crate dependencies. Grouped minor/patch bumps to keep PR noise low;
  # major bumps still come as individual PRs so they get a proper look.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"

  # Keep the GitHub Actions used in CI (checkout, rust-cache, audit-check) current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    commit-message:
      prefix: "ci"
