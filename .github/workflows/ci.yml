name: CI
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Setup libvosk runtime
        run: |
          mkdir -p files/runtime
          curl -sL https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip -o /tmp/vosk.zip
          unzip -qo /tmp/vosk.zip -d /tmp/vosk
          cp $(find /tmp/vosk -name libvosk.so | head -1) files/runtime/libvosk.so
          rm -rf /tmp/vosk /tmp/vosk.zip
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log || {
            grep -E "^(error|warning):" /tmp/clippy.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - name: Build
        run: cargo build --verbose
      - name: Unit tests
        run: |
          cargo test --verbose 2>&1 | tee /tmp/test.log || {
            grep -E "(FAILED|panicked at)" /tmp/test.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 100 /tmp/test.log
            exit 1
          }

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked
      - name: Security audit
        run: cargo audit

  testapi:
    name: TestAPI Integration
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ros_telegram_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ros_telegram_bot"
      REDIS_URL: "redis://127.0.0.1:6379"
      ADMIN_USER_ID: "123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup libvosk runtime
        run: |
          mkdir -p files/runtime
          curl -sL https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip -o /tmp/vosk.zip
          unzip -qo /tmp/vosk.zip -d /tmp/vosk
          cp $(find /tmp/vosk -name libvosk.so | head -1) files/runtime/libvosk.so
          rm -rf /tmp/vosk /tmp/vosk.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg redis-tools fonts-dejavu-core espeak-ng-data
          python -m pip install edge-tts
          mkdir -p models/piper/fa_IR
          # Use a public Persian Piper fixture with the engine's configured filenames.
          PIPER_BASE=https://huggingface.co/rhasspy/piper-voices/resolve/cf910fb59f1d79ab3b625a63993a108751c6c25d/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx
          curl --fail --location --retry 3 "$PIPER_BASE" -o models/piper/fa_IR/fa_IR-mantatts-par.onnx
          curl --fail --location --retry 3 "$PIPER_BASE.json" -o models/piper/fa_IR/fa_IR-mantatts-par.onnx.json
      - name: Start test CPU broker
        run: |
          python -m unittest discover -s tests -p test_cpu_broker_fixture.py
          python scripts/testapi_cpu_broker.py > /tmp/testapi_cpu_broker.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:6589/cpu/user_cores; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:6589/cpu/user_cores | python -c 'import json,sys; assert json.load(sys.stdin)["is_busy"] is False'
      - name: Configure test environment
        run: |
          cat << 'EOF' > .env
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/ros_telegram_bot"
          REDIS_URL="redis://127.0.0.1:6379"
          ADMIN_USER_ID="123456789"
          BOT_TOKEN="123456:TESTAPI_DUMMY_TOKEN"
          BOT_API_BASE_URL="http://127.0.0.1:14379/bot"
          EOF
      - name: Build with testapi feature
        run: cargo build --features testapi
      - name: Run testapi suite
        run: |
          bash scripts/run_testapi_suite.sh 2>&1 | tee /tmp/testapi_suite.log || {
            tail -n 80 /tmp/testapi_suite.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
