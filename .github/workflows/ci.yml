name: CI

on:
  push:
    branches: [ main, master, dev, "advisor/*" ]
  pull_request:
    branches: [ main, master, dev ]
  schedule:
    # Weekly re-audit so newly-disclosed CVEs are caught even without a push.
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo test
        run: LD_LIBRARY_PATH=files/runtime cargo test

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings

  security-audit:
    # Scans the dependency tree against the RustSec advisory DB for known
    # vulnerabilities. Separate job so a CVE disclosure surfaces without
    # blocking build/test feedback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit dependencies for known vulnerabilities
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
