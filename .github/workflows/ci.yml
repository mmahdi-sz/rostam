name: CI
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Setup libvosk runtime
        run: |
          mkdir -p files/runtime
          curl -sL https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip -o /tmp/vosk.zip
          unzip -qo /tmp/vosk.zip -d /tmp/vosk
          cp $(find /tmp/vosk -name libvosk.so | head -1) files/runtime/libvosk.so
          rm -rf /tmp/vosk /tmp/vosk.zip
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log || {
            grep -E "^(error|warning):" /tmp/clippy.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - name: Build
        run: cargo build --verbose
      - name: Unit tests
        run: |
          cargo test --verbose 2>&1 | tee /tmp/test.log || {
            grep -E "(FAILED|panicked at)" /tmp/test.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 100 /tmp/test.log
            exit 1
          }

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked
      - name: Security audit
        run: cargo audit

  testapi:
    name: TestAPI Integration
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup libvosk runtime
        run: |
          mkdir -p files/runtime
          curl -sL https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip -o /tmp/vosk.zip
          unzip -qo /tmp/vosk.zip -d /tmp/vosk
          cp $(find /tmp/vosk -name libvosk.so | head -1) files/runtime/libvosk.so
          rm -rf /tmp/vosk /tmp/vosk.zip
      - name: Build with testapi feature
        run: cargo build --features testapi
      - name: Run testapi suite
        run: bash scripts/run_testapi_suite.sh
